<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${speaker.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('speaker')}"></header>

<main>
    <div class="headline">
        <h1 th:text="${speaker.name}">Max Muster</h1>
        <a class="back" th:href="@{/speaker}">Zurück zur Liste</a>
    </div>

    <div class="bento">
        <section class="tile quarter">
            <div th:replace="~{fragments/speaker-photo :: speaker-photo}"></div>
        </section>

        <section class="tile three">
            <h2>Stammdaten</h2>
            <div th:replace="~{fragments/speaker-fields :: speaker-fields}"></div>
        </section>

        <section class="tile half" th:if="${!#lists.isEmpty(speaker.links)}">
            <h2>Links</h2>
            <ul class="plain">
                <li th:each="link : ${speaker.links}">
                    <a th:href="${link.url}" th:text="${link.display()}" rel="noreferrer">Blog</a>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
