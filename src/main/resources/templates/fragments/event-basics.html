<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="event-basics" th:fragment="event-basics">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <!-- Two evenings on one day is unusual, not forbidden. The date is stored either way. -->
    <p class="notice" th:unless="${#lists.isEmpty(clashes)}">
        An diesem Tag ist bereits geplant:
        <span th:each="other, i : ${clashes}"
        ><a th:href="@{/event/{id}(id=${other.id})}"
            th:text="${other.displayName()} ?: 'Ohne Titel'">Ohne Titel</a
        ><span th:unless="${i.last}">, </span></span>
    </p>

    <form class="guarded" method="post" th:action="@{/event/{id}(id=${event.id})}"
          th:hx-post="@{/event/{id}(id=${event.id})}"
          hx-target="#event-basics"
          hx-swap="outerHTML">
        <div class="row even">
            <label>Datum
                <input type="date" name="date" th:value="${event.date}">
                <span class="hint" th:if="${event.startsAt()}"
                      th:text="|(${#temporals.format(event.startsAt(), 'HH:mm')} Uhr)|">(19:00 Uhr)</span>
            </label>
            <label>Form
                <select name="mode">
                    <option th:each="way : ${modes}" th:value="${way}"
                            th:selected="${way} == ${event.mode}"
                            th:text="#{'event.mode.' + ${way}}">Vor Ort</option>
                </select>
            </label>
        </div>

        <label>Moderation
            <input type="text" name="moderator" th:value="${event.moderator}"
                   placeholder="Wer führt durch den Abend">
        </label>

        <label>Event Name
            <input type="text" name="motto" th:value="${event.motto}"
                   th:placeholder="${event.nameFromItsTalk()} ?: 'Heißt wie sein erster Vortrag'">
        </label>

        <p class="hint" th:if="${event.hasSeveralTalks()}">
            Dieser Abend trägt mehrere Vorträge — ein eigener Name lohnt sich hier.
        </p>

        <label>Notizen
            <textarea name="notes" rows="4" th:text="${event.notes}"
                      placeholder="Was sonst noch zu diesem Abend zu merken ist"></textarea>
        </label>

        <div class="actions">
            <button type="submit" disabled>Änderungen speichern</button>
        </div>
    </form>

    <!-- Who is speaking is one of the facts of the evening, so it stands with them rather
         than in a tile of its own. Nothing here is edited: the talks say who speaks, and
         the person is maintained on their own page. -->
    <p class="caption">Referenten</p>
    <ul class="plain people">
        <li th:each="person : ${eventSpeakers}">
            <a th:href="@{/speaker/{id}(id=${person.id})}"
               th:text="${person.name}">Max Muster</a>
            <span class="hint" th:if="${person.company}"
                  th:text="${person.company}">Nordsee GmbH</span>
            <span class="hint">
                <a th:href="'mailto:' + ${person.email}"
                   th:text="${person.email}">max@example.org</a>
            </span>
        </li>
    </ul>
</div>
</body>
</html>
