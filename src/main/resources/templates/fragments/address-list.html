<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The answer to every address change: the list, and the summary tile that depends on it. -->
<th:block th:fragment="address-list-and-summary">
    <div th:replace="~{fragments/address-list :: address-list}"></div>
    <div th:replace="~{fragments/location-summary :: location-summary}"></div>
    <div th:replace="~{fragments/location-map :: location-map}"></div>
</th:block>

<div id="address-list" th:fragment="address-list">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <p class="hint" th:if="${#lists.isEmpty(location.addresses)}">Noch keine Adresse erfasst.</p>

    <table th:unless="${#lists.isEmpty(location.addresses)}">
        <tbody>
        <tr th:each="address, i : ${location.addresses}" th:classappend="${!address.active} ? 'closed'">
            <!-- A typo is put right where it stands; a move is a new address below. -->
            <td>
                <details class="amend">
                    <summary th:text="${address.line()}"
                             title="Tippfehler berichtigen">Musterweg 1, 22179 Hamburg</summary>
                    <form class="amend guarded" method="post"
                          th:action="@{/location/{id}/address/{pos}/correct(id=${location.id},pos=${i.index})}"
                          th:hx-post="@{/location/{id}/address/{pos}/correct(id=${location.id},pos=${i.index})}"
                          hx-target="#address-list"
                          hx-swap="outerHTML">
                        <input type="text" name="street" aria-label="Straße und Hausnummer"
                               placeholder="Straße und Hausnummer" th:value="${address.street}">
                        <input type="text" name="postalCode" class="narrow" inputmode="numeric"
                               aria-label="PLZ" placeholder="PLZ" th:value="${address.postalCode}">
                        <input type="text" name="city" aria-label="Stadt"
                               placeholder="Stadt" th:value="${address.city}">
                        <button type="submit" class="link" disabled>Berichtigen</button>
                    </form>
                </details>
            </td>
            <!-- The seat count was counted by hand and may be put right on its own. -->
            <td class="data">
                <form class="seats guarded" method="post"
                      th:action="@{/location/{id}/address/{pos}/capacity(id=${location.id},pos=${i.index})}"
                      th:hx-post="@{/location/{id}/address/{pos}/capacity(id=${location.id},pos=${i.index})}"
                      hx-target="#address-list"
                      hx-swap="outerHTML">
                    <input type="number" name="capacity" min="1" placeholder="—"
                           aria-label="Plätze" th:value="${address.capacity}">
                    <span>Plätze</span>
                    <button type="submit" class="link" disabled>Speichern</button>
                </form>
            </td>
            <td>
                <span class="badge" th:classappend="${!address.active} ? 'quiet'"
                      th:text="${address.active} ? 'aktiv' : 'ehemalig'">aktiv</span>
            </td>
            <td style="text-align: right">
                <span class="actions">
                    <button type="button" class="link"
                            th:if="${canLocate} and !${address.isLocated()}"
                            th:hx-post="@{/location/{id}/address/{pos}/locate(id=${location.id},pos=${i.index})}"
                            hx-target="#address-list"
                            hx-swap="outerHTML">Auf der Karte suchen</button>
                    <button type="button" class="link"
                            th:hx-post="@{/location/{id}/address/{pos}(id=${location.id},pos=${i.index},active=${!address.active})}"
                            hx-target="#address-list"
                            hx-swap="outerHTML"
                            th:text="${address.active} ? 'Stilllegen' : 'Wieder aktiv'">Stilllegen</button>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
