<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="speaker-table" class="card" th:fragment="speaker-table">
    <table>
        <caption th:if="${#lists.isEmpty(speakers)}">Keine Referenten gefunden.</caption>
        <thead th:unless="${#lists.isEmpty(speakers)}">
        <tr>
            <th>Name</th>
            <th>Firma</th>
            <th>E-Mail</th>
            <th>Telefon</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="speaker : ${speakers}">
            <td><a th:href="@{/speaker/{id}(id=${speaker.id})}" th:text="${speaker.name}">Max Muster</a></td>
            <td th:text="${speaker.company} ?: '—'">Musterfirma GmbH</td>
            <td class="data"><a th:href="'mailto:' + ${speaker.email}" th:text="${speaker.email}">max@example.org</a></td>
            <td class="data" th:text="${speaker.phone} ?: '—'">—</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
