<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="contact-list" th:fragment="contact-list">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <form class="inline boxed" method="post"
          th:each="contact, i : ${location.contacts}"
          th:action="@{/location/{id}/contact/{pos}(id=${location.id},pos=${i.index})}"
          th:hx-post="@{/location/{id}/contact/{pos}(id=${location.id},pos=${i.index})}"
          hx-target="#contact-list"
          hx-swap="outerHTML">
        <label>Name
            <input type="text" name="contactName" required th:value="${contact.name}">
        </label>
        <label>
            <span class="captioned">E-Mail
                <a th:if="${contact.email}" th:href="'mailto:' + ${contact.email}"
                   title="Mail an diesen Ansprechpartner schreiben">Schreiben</a>
            </span>
            <input type="email" name="contactEmail" required th:value="${contact.email}">
        </label>
        <label>Telefon
            <input type="tel" name="contactPhone" th:value="${contact.phone}">
        </label>
        <button type="submit">Speichern</button>
        <button type="button" class="link"
                th:hx-post="@{/location/{id}/contact/{pos}/remove(id=${location.id},pos=${i.index})}"
                hx-target="#contact-list"
                hx-swap="outerHTML">Entfernen</button>
    </form>
</div>
</body>
</html>
