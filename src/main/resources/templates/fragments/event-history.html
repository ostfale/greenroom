<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="event-history" class="stack" th:fragment="event-history">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <p class="hint" th:if="${#lists.isEmpty(history)}">Noch nichts festgehalten.</p>

    <table th:unless="${#lists.isEmpty(history)}">
        <tbody>
        <tr th:each="entry : ${history}">
            <td class="data" th:text="${#temporals.format(entry.happenedOn, 'dd.MM.yyyy')}">24.08.2026</td>
            <td class="data" th:title="#{'activity.kind.' + ${entry.kind}}"
                th:switch="${entry.kind.name()}">
                <span th:case="'MAIL_SENT'">↗</span>
                <span th:case="*">↙</span>
            </td>
            <td th:text="${entry.what}">Termin angefragt</td>
        </tr>
        </tbody>
    </table>

    <!-- Append-only: what is written stays. A line that was wrong is answered by the next. -->
    <details class="reveal">
        <summary>Eintrag festhalten</summary>
        <form class="inline boxed new" method="post"
              th:action="@{/event/{id}/activity(id=${event.id})}"
              th:hx-post="@{/event/{id}/activity(id=${event.id})}"
              hx-target="#event-history"
              hx-swap="outerHTML"
              hx-on::after-request="closeUnlessRefused(this, '#event-history')">
            <label>Am
                <input type="date" name="happenedOn" th:value="${today}">
            </label>
            <label>Art
                <select name="kind" required>
                    <option th:each="way : ${kinds}" th:value="${way}"
                            th:text="#{'activity.kind.' + ${way}}">Mail gesendet</option>
                </select>
            </label>
            <label>Was
                <input type="text" name="what" required
                       placeholder="Termin angefragt, Antwort steht noch aus">
            </label>
            <button type="submit">Festhalten</button>
        </form>
    </details>
</div>
</body>
</html>
