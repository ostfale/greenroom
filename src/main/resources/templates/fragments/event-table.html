<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="event-table" class="card" th:fragment="event-table">
    <table>
        <!-- Nothing planned and nothing matching are two different empty lists. -->
        <caption th:if="${#lists.isEmpty(events)}"
                 th:text="${anyEvents} ? 'Kein Event passt zu diesem Filter.'
                                       : 'Noch kein Event geplant.'">Noch kein Event geplant.</caption>
        <thead th:unless="${#lists.isEmpty(events)}">
        <tr>
            <th>Datum</th>
            <th>Referent</th>
            <th>Event</th>
            <th>Planung</th>
            <th>Ort</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}" th:classappend="${event.status.isClosed()} ? 'closed'">
            <td class="data" th:text="${event.date} != null ? ${#temporals.format(event.date, 'dd.MM.yyyy')} : '—'">—</td>
            <!-- Who speaks says more about an evening than how many talks it holds. One
                 name is the usual case; the rest of them are behind the link. -->
            <td th:with="people=${event.speakerIds()}"
                th:text="${(speakerNames[people[0]] ?: '—')
                        + (#lists.size(people) > 1 ? ' u.a.' : '')}">Max Muster</td>
            <td><a th:href="@{/event/{id}(id=${event.id})}"
                   th:text="${event.displayName()} ?: 'Ohne Titel'">Ohne Titel</a></td>
            <td>
                <div class="steps">
                    <span class="progress"
                          th:classappend="${event.status.name() == 'POSTPONED'} ? 'postponed'
                                        : (${event.status.isClosed() and event.status.name() == 'CANCELLED'} ? 'cancelled' : '')">
                        <i th:each="step : ${#numbers.sequence(1, 4)}"
                           th:classappend="${step <= event.status.plannedSteps()} ? 'done'"></i>
                    </span>
                    <span class="label" th:text="#{'event.status.' + ${event.status}}">Thema</span>
                </div>
            </td>
            <td th:text="${event.locationId} != null ? ${locationNames[event.locationId]} : '—'">—</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
