<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="speaker-fields" th:fragment="speaker-fields">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <form class="guarded" method="post" th:action="@{/speaker/{id}(id=${speaker.id})}"
          th:hx-post="@{/speaker/{id}(id=${speaker.id})}"
          hx-target="#speaker-fields"
          hx-swap="outerHTML">
        <div class="row even">
            <label>Name
                <input type="text" name="name" required th:value="${speaker.name}">
            </label>
            <label>
                <span class="captioned">E-Mail
                    <a th:if="${speaker.email}" th:href="'mailto:' + ${speaker.email}"
                       title="Mail an diese Adresse schreiben">Schreiben</a>
                </span>
                <input type="email" name="email" required th:value="${speaker.email}">
            </label>
        </div>
        <div class="row even">
            <label>Firma
                <input type="text" name="company" th:value="${speaker.company}">
            </label>
            <label>Telefon
                <input type="tel" name="phone" th:value="${speaker.phone}">
            </label>
        </div>
        <label>Kurzvita
            <textarea name="bio" rows="8" th:text="${speaker.bio}"></textarea>
        </label>
        <label>Notizen
            <textarea name="notes" rows="5" th:text="${speaker.notes}"></textarea>
        </label>

        <div class="actions">
            <button type="submit" disabled>Änderungen speichern</button>
        </div>
    </form>

    <!-- Like the place: irreversible, so it takes a second click. A refused delete swaps
         this whole block, which closes the fold again. -->
    <details class="reveal danger">
        <summary>Referenten löschen</summary>
        <p class="hint">
            Mit dem Referenten verschwinden sein Bild und seine Links. Das lässt sich nicht
            zurückholen. Wer für einen Vortrag angekündigt ist, bleibt bestehen — die
            Geschichte eines Abends zeigt auf ihn.
        </p>
        <button type="button" class="danger"
                th:hx-post="@{/speaker/{id}/remove(id=${speaker.id})}"
                hx-target="#speaker-fields"
                hx-swap="outerHTML"
                th:text="|„${speaker.name}“ endgültig löschen|">„Max Muster“ endgültig
            löschen</button>
    </details>
</div>
</body>
</html>
