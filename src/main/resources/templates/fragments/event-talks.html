<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="event-talks" class="stack" th:fragment="event-talks">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <!-- What names and files the talk heads it across the tile; the two blocks of prose
         it is announced with stand side by side under that, where the page is wide enough.
         One column of prose stretched over the whole tile is a worse line to read than a
         narrower one. -->
    <form class="boxed guarded talk" method="post"
          th:each="talk, i : ${event.talks}"
          th:action="@{/event/{id}/talk/{pos}(id=${event.id},pos=${i.index})}"
          th:hx-post="@{/event/{id}/talk/{pos}(id=${event.id},pos=${i.index})}"
          hx-target="#event-talks"
          hx-swap="outerHTML">
        <p class="hint" th:unless="${talk.isReadyToPublish()}">
            <span class="badge quiet">unvollständig</span>
        </p>

        <!-- Across both columns: what the talk is called heads it, it does not belong to
             one half of it. -->
        <div class="row even">
            <label>Titel
                <input type="text" name="title" th:value="${talk.title}">
            </label>
            <label>Beginn
                <input type="time" name="startsAt" class="narrow" th:value="${talk.startsAt}">
            </label>
        </div>

        <!-- The words belong to the talk, not to the evening: a night with a Spring talk
             and a Kotlin talk is not a night about both. They file it the way the title
             names it, so they stand with it and across the tile. Saved with everything
             else on this form — what is ticked when it is sent is what it carries. -->
        <div class="keywords">
            <p class="caption">Tags</p>
            <p class="hint" th:if="${#lists.isEmpty(tagChoices)}">
                Es ist noch kein Tag angelegt. <a th:href="@{/settings}">Tags pflegen</a>
            </p>
            <ul class="tags" th:unless="${#lists.isEmpty(tagChoices)}">
                <li th:each="word : ${tagChoices}">
                    <label class="toggle">
                        <input type="checkbox" name="tag" th:value="${word}"
                               th:checked="${talk.carries(word)}">
                        <span th:text="${word}">Spring</span>
                    </label>
                </li>
            </ul>
        </div>

        <label class="abstract">Abstract
            <textarea name="abstractText" rows="6" th:text="${talk.abstractText}"></textarea>
        </label>

        <!-- The biography was copied when the speaker was put on this talk. It is edited
             here and nowhere else: what the evening announced is not the speaker's current
             bio, and changing one must not change the other. -->
        <div class="bios">
            <label th:each="announced : ${talk.speakers}">
                <span th:text="'Kurzvita ' + (${speakerNames[announced.speakerId]} ?: 'Unbekannt')">Kurzvita Max Muster</span>
                <textarea name="announcedBio" rows="3" th:text="${announced.announcedBio}"
                          placeholder="Wie sie in der Ankündigung stehen soll"></textarea>
            </label>
        </div>

        <div class="actions">
            <button type="submit" disabled>Vortrag speichern</button>
            <button type="button" class="danger" th:if="${event.hasSeveralTalks()}"
                    th:hx-post="@{/event/{id}/talk/{pos}/remove(id=${event.id},pos=${i.index})}"
                    hx-target="#event-talks"
                    hx-swap="outerHTML">Vortrag entfernen</button>
        </div>
    </form>

    <!-- A second voice is the exception, so the fields wait to be asked for. -->
    <details class="reveal">
        <summary>Weiterer Vortrag</summary>
        <form class="boxed new" method="post"
              th:action="@{/event/{id}/talk(id=${event.id})}"
              th:hx-post="@{/event/{id}/talk(id=${event.id})}"
              hx-target="#event-talks"
              hx-swap="outerHTML"
              hx-on::after-request="closeUnlessRefused(this, '#event-talks')">
            <label>Referent
                <select name="speakerId" required>
                    <option value="">Bitte auswählen</option>
                    <option th:each="person : ${speakers}"
                            th:value="${person.id}"
                            th:text="${person.name}">Max Muster</option>
                </select>
            </label>
            <label>Titel des Vortrags
                <input type="text" name="title" placeholder="Kann noch offen bleiben">
            </label>
            <label>Beginn
                <input type="time" name="startsAt" class="narrow" value="20:00">
            </label>
            <button type="submit">Vortrag hinzufügen</button>
        </form>
    </details>
</div>
</body>
</html>
