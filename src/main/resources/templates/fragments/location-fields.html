<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The website stands in the summary tile, so saving the form sends both back. -->
<th:block th:fragment="location-fields-and-summary">
    <div th:replace="~{fragments/location-fields :: location-fields}"></div>
    <div th:replace="~{fragments/location-summary :: location-summary}"></div>
</th:block>

<div id="location-fields" th:fragment="location-fields">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <form method="post" th:action="@{/location/{id}(id=${location.id})}"
          th:hx-post="@{/location/{id}(id=${location.id})}"
          hx-target="#location-fields"
          hx-swap="outerHTML">
        <label>Name
            <input type="text" name="name" required th:value="${location.name}">
        </label>
        <label>
            <span class="captioned">Webseite
                <a th:if="${location.website}" th:href="${location.website}"
                   target="_blank" rel="noreferrer"
                   title="Webseite dieses Ortes öffnen">Öffnen</a>
            </span>
            <!-- Not type="url": that one rejects "www.firma.de", which is how a homepage is
                 written down. The record puts the scheme in front. -->
            <input type="text" name="website" placeholder="www.musterfirma.de"
                   th:value="${location.website}">
        </label>
        <label>Notizen
            <textarea name="notes" rows="3" th:text="${location.notes}"></textarea>
        </label>
        <!-- Unticked sends nothing, which the route reads as "not active". -->
        <label class="toggle">
            <input type="checkbox" name="inUse" value="true" th:checked="${location.inUse}">
            Aktiv
        </label>

        <div class="actions">
            <button type="submit">Änderungen speichern</button>
        </div>
    </form>
</div>
</body>
</html>
