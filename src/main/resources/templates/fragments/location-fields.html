<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="location-fields" th:fragment="location-fields">
    <p class="error" th:if="${error}" th:text="${error}">Fehler</p>

    <form method="post" th:action="@{/location/{id}(id=${location.id})}"
          th:hx-post="@{/location/{id}(id=${location.id})}"
          hx-target="#location-fields"
          hx-swap="outerHTML">
        <label>Name
            <input type="text" name="name" required th:value="${location.name}">
        </label>
        <label>Notizen
            <textarea name="notes" rows="3" th:text="${location.notes}"></textarea>
        </label>

        <div class="actions">
            <button type="submit">Änderungen speichern</button>
        </div>
    </form>
</div>
</body>
</html>
