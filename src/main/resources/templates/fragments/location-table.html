<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="location-table" class="card" th:fragment="location-table">
    <table>
        <caption th:if="${#lists.isEmpty(locations)}">Keine Orte gefunden.</caption>
        <thead th:unless="${#lists.isEmpty(locations)}">
        <tr>
            <th>Ort</th>
            <th>Adresse</th>
            <th>Plätze</th>
            <th>Ansprechpartner</th>
        </tr>
        </thead>
        <tbody>
        <!-- An inactive place reads as one, without leaving the list. -->
        <tr th:each="location : ${locations}" th:classappend="${!location.inUse} ? 'closed'">
            <td>
                <a th:href="@{/location/{id}(id=${location.id})}"
                   th:text="${location.name}">Musterfirma GmbH</a>
                <span class="badge quiet" th:unless="${location.inUse}">Inaktiv</span>
            </td>
            <td th:text="${#strings.isEmpty(location.addressLine())} ? '—' : ${location.addressLine()}">—</td>
            <td class="data" th:text="${location.currentCapacity()} ?: '—'">—</td>
            <td>
                <span th:each="contact, i : ${location.contacts}">
                    <span th:if="${!i.first}">, </span>
                    <a th:href="'mailto:' + ${contact.email}" th:text="${contact.name}">Max Muster</a>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
