<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${location.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <div class="headline">
        <h1 th:text="${location.name}">Musterfirma GmbH</h1>
        <a th:href="@{/location}">Zurück zur Liste</a>
    </div>

    <section>
        <h2>Adressen</h2>
        <p class="hint">
            Zieht der Gastgeber um, bleibt die alte Adresse stehen: ein Event, das dort war,
            war dort. „Umgezogen“ legt die bisherigen still, sonst kommt ein zweiter
            Standort dazu.
        </p>

        <div th:replace="~{fragments/address-list :: address-list}"></div>

        <form class="inline wrap" method="post"
              th:action="@{/location/{id}/address(id=${location.id})}"
              th:hx-post="@{/location/{id}/address(id=${location.id})}"
              hx-target="#address-list"
              hx-swap="outerHTML"
              hx-on::after-request="this.reset()">
            <label>Straße und Hausnummer
                <input type="text" name="street">
            </label>
            <label>PLZ
                <input type="text" name="postalCode" class="narrow" inputmode="numeric">
            </label>
            <label>Stadt
                <input type="text" name="city">
            </label>
            <label>Plätze
                <input type="number" name="capacity" min="1" class="narrow">
            </label>
            <label class="toggle inline-toggle">
                <input type="checkbox" name="moved" value="true">
                Umgezogen
            </label>
            <button type="submit">Adresse hinzufügen</button>
        </form>
    </section>

    <section>
        <h2>Ansprechpartner</h2>
        <table>
            <tbody>
            <tr th:each="contact : ${location.contacts}">
                <td th:text="${contact.name}">Max Muster</td>
                <td><a th:href="'mailto:' + ${contact.email}" th:text="${contact.email}">max@example.org</a></td>
                <td th:text="${contact.phone} ?: '—'">—</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section>
        <h2>Notizen</h2>
        <p th:text="${location.notes} ?: '—'">—</p>
    </section>
</main>
</body>
</html>
