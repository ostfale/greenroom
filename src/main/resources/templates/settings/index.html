<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Einstellungen')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('settings')}"></header>

<main>
    <div class="headline">
        <h1>Einstellungen</h1>
    </div>

    <div class="bento">
        <section class="tile half">
            <h2>Tags</h2>
            <p class="hint">
                Die Liste, aus der ein Event seine Tags bekommt. Groß- und
                Kleinschreibung spielt keine Rolle: dasselbe Wort gibt es nur einmal.
            </p>

            <form class="inline boxed new" method="post" th:action="@{/settings/tag}"
                  th:hx-post="@{/settings/tag}"
                  hx-target="#tag-list"
                  hx-swap="outerHTML"
                  hx-on::after-request="this.reset()">
                <label>Neuer Tag
                    <input type="text" name="name" required placeholder="Spring"
                           th:value="${submittedName}">
                </label>
                <button type="submit">Hinzufügen</button>
            </form>

            <div th:replace="~{fragments/tag-list :: tag-list}"></div>
        </section>

        <section class="tile half" id="about">
            <h2>Über</h2>
            <p>
                greenroom Version <span th:text="${version}">1.1.0</span>
            </p>
            <p class="hint">
                Entwickelt von Uwe Sauerbrei. Kontakt:
                <a href="mailto:info@uwe-sauerbrei.de">info@uwe-sauerbrei.de</a>
            </p>
        </section>
    </div>
</main>
</body>
</html>
