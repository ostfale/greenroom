<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Einstellungen')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('settings')}"></header>

<main>
    <div class="headline">
        <h1>Einstellungen</h1>
    </div>

    <div class="bento">
        <section class="tile half">
            <h2>Schlagwörter</h2>
            <p class="hint">
                Die Liste, aus der ein Event seine Schlagwörter bekommt. Groß- und
                Kleinschreibung spielt keine Rolle: dasselbe Wort gibt es nur einmal.
            </p>

            <form class="inline boxed new" method="post" th:action="@{/settings/tag}"
                  th:hx-post="@{/settings/tag}"
                  hx-target="#tag-list"
                  hx-swap="outerHTML"
                  hx-on::after-request="this.reset()">
                <label>Neues Schlagwort
                    <input type="text" name="name" required placeholder="Spring"
                           th:value="${submittedName}">
                </label>
                <button type="submit">Hinzufügen</button>
            </form>

            <div th:replace="~{fragments/tag-list :: tag-list}"></div>
        </section>
    </div>
</main>
</body>
</html>
