# The draft an inquiry mail opens with. Edited on the page before it goes out — {0} is the
# date the evening is planned for.
inquiry.mail.speaker.subject=JUG Hamburg — Vortrag am {0}
inquiry.mail.speaker.body=Hallo,\n\nwir planen bei der JUG Hamburg einen Abend am {0} und würden uns sehr freuen, wenn du deinen Vortrag bei uns halten würdest.\n\nPasst dir der Termin?\n\nViele Grüße\nJava User Group Hamburg
inquiry.mail.venue.subject=JUG Hamburg — Raumanfrage für den {0}
inquiry.mail.venue.body=Hallo,\n\nwir planen bei der JUG Hamburg einen Abend am {0} und suchen dafür einen Raum für etwa 50 Personen, von 18:30 bis etwa 21:30 Uhr.\n\nWäre das bei euch möglich?\n\nViele Grüße\nJava User Group Hamburg

# What was refused, and what the page says about it. The key is the Rule constant; a
# constant without a key here is what MessagesTest fails on. Arguments go through
# MessageFormat, so an apostrophe in a text that uses one has to be doubled.
rule.EVENT_NEEDS_A_STATUS=Dem Event fehlt ein Status.
rule.EVENT_NEEDS_A_MODE=Dem Event fehlt die Angabe, wie der Abend stattfindet.
rule.EVENT_NEEDS_ONE_TALK=Der letzte Vortrag kann nicht entfernt werden — ohne ihn ist es kein Event.
rule.EVENT_NEEDS_A_DATE=Dafür braucht das Event ein Datum.
rule.EVENT_NEEDS_A_LOCATION=Dafür braucht das Event einen Ort.
rule.EVENT_NEEDS_PUBLISHABLE_TALKS=Dafür braucht jeder Vortrag einen Titel und eine Beschreibung.
rule.EVENT_DOES_NOT_MOVE=Dieser Schritt ist von hier aus nicht möglich.
rule.NO_TALK_AT_POSITION=Diesen Vortrag gibt es nicht mehr — bitte die Seite neu laden.
rule.TAG_NEEDS_A_WORD=Ein Tag braucht ein Wort.
rule.TAG_TWICE_ON_EVENT=Dieser Tag steht schon an diesem Event.

rule.TALK_NEEDS_A_SPEAKER=Ein Vortrag braucht mindestens einen Referenten.
rule.SPEAKER_TWICE_ON_TALK=Dieser Referent steht schon an diesem Vortrag.
rule.SPEAKER_NOT_STORED=Dieser Referent ist noch nicht gespeichert.

rule.INQUIRY_BELONGS_TO_AN_EVENT=Diese Anfrage gehört zu keinem Event.
rule.INQUIRY_NEEDS_A_SPEAKER=Bitte einen Referenten auswählen.
rule.INQUIRY_NEEDS_A_LOCATION=Bitte einen Ort auswählen.
rule.INQUIRY_NEEDS_A_SENT_DATE=Bitte angeben, wann die Anfrage rausgegangen ist.
rule.INQUIRY_NEEDS_A_CHANNEL=Bitte angeben, auf welchem Weg gefragt wurde.
rule.INQUIRY_NEEDS_AN_OUTCOME=Bitte eine Antwort auswählen.
rule.INQUIRY_ANSWER_IS_DATED=Zu einer Antwort gehört der Tag, an dem sie kam.
rule.INQUIRY_ALREADY_ANSWERED=Diese Anfrage ist schon beantwortet. Für einen neuen Versuch bitte eine neue Anfrage anlegen.
rule.PENDING_IS_NOT_AN_ANSWER=Bitte eine Antwort auswählen.
rule.VENUE_INQUIRY_NEEDS_A_DATE=Zuerst braucht das Event einen Termin — danach werden die Orte gefragt.
rule.NO_SUCH_INQUIRY=Diese Anfrage gibt es nicht mehr — bitte die Seite neu laden.

rule.ACTIVITY_BELONGS_TO_AN_EVENT=Dieser Eintrag gehört zu keinem Event.
rule.ACTIVITY_IS_DATED=Bitte angeben, wann es passiert ist.
rule.ACTIVITY_NEEDS_A_DIRECTION=Bitte angeben, ob der Eintrag raus, rein oder nur notiert ist.
rule.ACTIVITY_NEEDS_A_CHANNEL=Bitte angeben, auf welchem Weg der Eintrag raus- oder reingegangen ist.
rule.ACTIVITY_NEEDS_A_TEXT=Bitte eintragen, was passiert ist.
rule.NOTE_HAS_NO_CHANNEL=Eine Notiz ging nirgendwohin — sie hat keinen Weg.

rule.LOCATION_NEEDS_A_NAME=Der Name des Ortes ist ein Pflichtfeld.
rule.LOCATION_NEEDS_A_CONTACT=Der letzte Ansprechpartner kann nicht entfernt werden — ohne ihn ist der Ort nicht nutzbar.
rule.NO_ADDRESS_AT_POSITION=Diese Adresse gibt es nicht mehr — bitte die Seite neu laden.
rule.NO_CONTACT_AT_POSITION=Diesen Ansprechpartner gibt es nicht mehr — bitte die Seite neu laden.
rule.ADDRESS_NEEDS_A_STREET_OR_TOWN=Eine Adresse braucht mindestens Straße oder Stadt.
rule.CAPACITY_IS_A_NUMBER_OF_SEATS=Die Plätze müssen eine Zahl größer als null sein.
rule.CAPACITY_BELONGS_TO_AN_ADDRESS=Die Plätze gehören zu einer Adresse — bitte auch die Adresse angeben.
rule.POSITION_IS_HALF=Zu diesem Punkt fehlt eine der beiden Koordinaten.
rule.POSITION_OFF_THE_PLANET=Dieser Punkt liegt nicht auf der Erde.
rule.CONTACT_NEEDS_A_NAME=Ein Ansprechpartner braucht einen Namen.
rule.CONTACT_NEEDS_AN_EMAIL=Ein Ansprechpartner braucht eine E-Mail-Adresse.

rule.SPEAKER_NEEDS_A_NAME=Bitte den Namen des Referenten eintragen.
rule.SPEAKER_NEEDS_AN_EMAIL=Der Referent braucht eine E-Mail-Adresse — an ihr wird er über die Jahre wiedererkannt.
rule.SPEAKER_LINK_NEEDS_A_URL=Ein Link braucht eine Adresse.
rule.SPEAKER_IS_ANNOUNCED_ON_A_TALK=Dieser Referent ist für einen Vortrag angekündigt und bleibt deshalb bestehen.
rule.SPEAKER_WAS_ASKED_ABOUT_AN_EVENING=Dieser Referent wurde für einen Abend angefragt; die Anfrage bleibt in der Historie.
rule.PHOTO_NEEDS_A_STORED_SPEAKER=Das Bild gehört zu einem Referenten, den es noch nicht gibt.
rule.PHOTO_IS_EMPTY=Es war kein Bild in der Datei.
rule.PHOTO_TOO_LARGE=Das Bild ist zu groß — bis zu 2 MB sind möglich.
rule.PHOTO_NOT_A_KIND_WE_SHOW=Nur JPEG, PNG, WebP oder GIF.

rule.NOTE_NEEDS_A_TITLE=Bitte ein Stichwort eingeben — der Text darf leer bleiben.
rule.NOTE_IS_STAMPED=Eine Notiz bekommt ihren Stempel, wenn sie geschrieben wird.
rule.NO_SUCH_NOTE=Diese Notiz gibt es nicht mehr — bitte die Seite neu laden.
rule.TAG_NEEDS_A_NAME=Bitte einen Tag eingeben.
rule.TAG_ALREADY_ON_THE_LIST=Der Tag {0} steht schon auf der Liste.
rule.NO_SUCH_TAG=Diesen Tag gibt es nicht mehr — bitte die Seite neu laden.

rule.MAIL_NEEDS_A_RECIPIENT=Bitte auswählen, an wen die Mail geht.
rule.MAIL_NEEDS_A_SUBJECT=Bitte einen Betreff eingeben.
rule.MAIL_NEEDS_A_BODY=Bitte einen Text eingeben.

rule.NO_SPEAKER_CHOSEN=Bitte einen Referenten auswählen.
rule.NO_LOCATION_CHOSEN=Bitte einen Ort auswählen.
rule.NO_CONTACT_CHOSEN=Bitte auswählen, wer an diesem Ort angeschrieben wird.
rule.DATE_UNREADABLE=Das Datum konnte nicht gelesen werden.
rule.NOT_FOUND=Das gibt es nicht mehr — bitte die Seite neu laden.

# Refusals that are nobody's rule: the mail server said no, or something went wrong that
# the page has no better word for.
error.mail.refused=Die Mail ist nicht rausgegangen — der Mailserver hat sie abgelehnt. Die Anfrage wurde deshalb auch nicht notiert.
error.generic=Die Änderung wurde nicht übernommen.

# Adding a speaker fails on the person or on the picture, and one of the two is worth
# saying together with what became of the other. {0} is the refusal itself.
error.speaker.notCreated={0} Der Referent wurde nicht angelegt.
