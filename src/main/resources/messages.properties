event.status.DATE_CONFIRMED=Termin steht
event.status.VENUE_CONFIRMED=Ort steht
event.status.PUBLISHED=Veröffentlicht
event.status.POSTPONED=Verschoben
event.status.DONE=Erledigt
event.status.CANCELLED=Abgesagt

# How an inquiry went out.
inquiry.channel.EMAIL=E-Mail
inquiry.channel.LINKEDIN=LinkedIn
inquiry.channel.PHONE=Telefon
inquiry.channel.IN_PERSON=Persönlich
inquiry.channel.OTHER=Anders

# And what came back.
inquiry.outcome.PENDING=Offen
inquiry.outcome.ACCEPTED=Zugesagt
inquiry.outcome.DECLINED=Abgesagt
inquiry.outcome.NO_RESPONSE=Keine Antwort

# How an evening was held. Kept for the imported years.
event.mode.ONSITE=Vor Ort
event.mode.ONLINE=Online
event.mode.HYBRID=Hybrid

# What kind of line the history is showing.
activity.direction.OUTGOING=Rausgegangen
activity.direction.INCOMING=Reingekommen
activity.direction.NOTE=Notiz

# The draft an inquiry mail opens with. Edited on the page before it goes out — {0} is the
# date the evening is planned for.
inquiry.mail.speaker.subject=JUG Hamburg — Vortrag am {0}
inquiry.mail.speaker.body=Hallo,\n\nwir planen bei der JUG Hamburg einen Abend am {0} und würden uns sehr freuen, wenn du deinen Vortrag bei uns halten würdest.\n\nPasst dir der Termin?\n\nViele Grüße\nJava User Group Hamburg
inquiry.mail.venue.subject=JUG Hamburg — Raumanfrage für den {0}
inquiry.mail.venue.body=Hallo,\n\nwir planen bei der JUG Hamburg einen Abend am {0} und suchen dafür einen Raum für etwa 50 Personen, von 18:30 bis etwa 21:30 Uhr.\n\nWäre das bei euch möglich?\n\nViele Grüße\nJava User Group Hamburg
