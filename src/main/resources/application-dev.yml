# Local development. Activated by `mvn spring-boot:run` through the Boot plugin, never
# baked into application.yml — on the Raspberry Pi the application runs without a profile.
spring:
  flyway:
    # Lets DevFlywayConfiguration rebuild the schema after V1__schema.sql was edited.
    # Development only: this permits dropping the whole database.
    clean-disabled: false
  thymeleaf:
    cache: false
  web:
    resources:
      # CSS and the vendored htmx straight from the source tree instead of from
      # target/classes, and without a cache header. The same idea as the Thymeleaf cache
      # being off: an edit shows on reload, with no rebuild and no stale file in between.
      static-locations: file:src/main/resources/static/,classpath:/static/
      cache:
        period: 0
