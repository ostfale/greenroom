spring:
  application:
    name: greenroom
    version: "@project.version@"
  servlet:
    multipart:
      # Room for a photo straight from a phone. It is scaled down before it is stored,
      # so what ends up in the database is a few dozen kilobytes.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8383}

management:
  server:
    port: ${MANAGEMENT_PORT:8382}
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: info,health,prometheus,mappings
  endpoint:
    health:
      show-details: always

greenroom:
  geo:
    # Off unless asked for. OpenStreetMap's search needs no key but does ask for an
    # identifying user agent, so without one nothing is looked up and no map is shown.
    enabled: ${GREENROOM_GEO_ENABLED:false}
    user-agent: ${GREENROOM_GEO_USER_AGENT:}
