spring:
  application:
    name: greenroom
    version: "@project.version@"
  servlet:
    multipart:
      # A little above what SpeakerPhoto accepts, so the record can refuse the file with
      # a German sentence instead of the container refusing it with a 500.
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${PORT:8383}

management:
  server:
    port: ${MANAGEMENT_PORT:8382}
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: info,health,prometheus,mappings
  endpoint:
    health:
      show-details: always
