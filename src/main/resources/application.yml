spring:
  application:
    name: greenroom
    version: "@project.version@"
  mail:
    # Host, user and password come from the environment on the Pi: SPRING_MAIL_HOST,
    # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD. Without a host nothing is sent and the
    # application logs the mail instead — that has to be the harmless default.
    port: ${SPRING_MAIL_PORT:465}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  servlet:
    multipart:
      # Room for a photo straight from a phone. It is scaled down before it is stored,
      # so what ends up in the database is a few dozen kilobytes.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8383}

management:
  server:
    port: ${MANAGEMENT_PORT:8382}
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: info,health,prometheus,mappings
  endpoint:
    health:
      show-details: always

greenroom:
  geo:
    # Off unless asked for. OpenStreetMap's search needs no key but does ask for an
    # identifying user agent, so without one nothing is looked up and no map is shown.
    enabled: ${GREENROOM_GEO_ENABLED:false}
    user-agent: ${GREENROOM_GEO_USER_AGENT:}
  mail:
    # The address every inquiry is sent from, replied to and blind-copied to. Empty here:
    # without it the application does not send.
    from: ${GREENROOM_MAIL_FROM:}
