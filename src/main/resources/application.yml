spring:
  application:
    name: greenroom
    version: "@project.version@"
  servlet:
    multipart:
      # Room for a photo straight from a phone. It is scaled down before it is stored,
      # so what ends up in the database is a few dozen kilobytes.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8383}

management:
  server:
    port: ${MANAGEMENT_PORT:8382}
  endpoints:
    web:
      base-path: /mgmt
      exposure:
        include: info,health,prometheus,mappings
  endpoint:
    health:
      show-details: always

logging:
  # The console keeps every level: that is what `docker logs` shows and what Alloy hands
  # to Loki. The file keeps the warnings alone, and only where one is named at all —
  # LOGGING_FILE_NAME is set on the Pi and nowhere else, so a build and a test write none.
  threshold:
    file: WARN
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 90
      total-size-cap: 200MB

greenroom:
  backup:
    # The line `backup.sh` appends every night, as the application sees it. On the Pi that
    # is the folder already mounted for the warning log; unset everywhere else, and the
    # settings page then says that it found no log instead of pretending there was none.
    log: ${GREENROOM_BACKUP_LOG:}
  geo:
    # Off unless asked for. OpenStreetMap's search needs no key but does ask for an
    # identifying user agent, so without one nothing is looked up and no map is shown.
    enabled: ${GREENROOM_GEO_ENABLED:false}
    user-agent: ${GREENROOM_GEO_USER_AGENT:}
