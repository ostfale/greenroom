name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No `services: postgres` here on purpose: the tests start their own database
    # through Testcontainers, and the runner already has Docker for that. A second
    # Postgres would only be a copy of the schema that nobody talks to.

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run every test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Keep the reports when something went red
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
